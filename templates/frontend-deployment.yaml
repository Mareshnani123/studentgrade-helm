apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-grade-ui
  namespace: {{ .Values.frontend.namespace }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: student-grade-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: student-grade-ui
        app.kubernetes.io/component: frontend
        app.kubernetes.io/instance: student-grade-ui
    spec:
      affinity:
       podAntiAffinity:
         requiredDuringSchedulingIgnoredDuringExecution:
         - labelSelector:
             matchExpressions:
             - key: "app.kubernetes.io/instance"
               operator: In
               values:
               - student-grade-ui
           topologyKey: "kubernetes.io/hostname" # Spreads pods across nodes
      containers:
      - name: student-grade-ui
        image: "{{ .Values.frontend.image.name }}:{{ .Values.frontend.image.tag }}"
        resources:
          requests:
            memory: "128Mi"
          limits:
            memory: "250Mi"
        ports:
        - containerPort: {{ .Values.frontend.service.port }}
      imagePullSecrets:
        - name: acr-secret
